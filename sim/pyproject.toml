[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim"
version = "0.1.0"
description = "A short description of the project"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "spicelib",
    "PySpice",
    "python-statemachine",
    "pandas",
    "matplotlib",
    "ortools",
    "scipy"
]

[project.optional-dependencies]
dev = [
    "ruff",
]
[tool.hatch.build.targets.wheel]
packages = ["src/sim"]
